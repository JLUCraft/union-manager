[package]
name = "jlucraft-manager-jni"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
name = "jlucraft_manager"
crate-type = ["cdylib","rlib"]
[dependencies]
events = { path = "../../union-core/crates/events" }
flows = { path = "../../union-core/crates/flows" }
zeroize = "1"
client = { path = "../../union-core/crates/client", features = ["league", "office"] }
jni = "0.21"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
