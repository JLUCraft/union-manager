name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/union-manager
    steps:
      # The JNI library links the shared library crates through sibling paths,
      # so CI reproduces the local workspace layout.
      - uses: actions/checkout@v7
        with:
          path: workspace/union-manager

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-core
          path: workspace/union-core

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/union-manager/native -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build the JNI library
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)}"
          ANDROID_NDK_HOME="$ndk" ./scripts/build-native.sh

      # Compiles the app, the unit tests and the instrumented test APK; running
      # the instrumented tests needs a dedicated device (scripts/test-android.sh connected).
      - name: Build and test
        run: ./scripts/test-android.sh build
